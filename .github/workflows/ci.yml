name: WorkTogether checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  native-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go -C backend test ./internal/service/chat ./internal/service/project ./internal/service/session ./internal/storage/sqlite ./internal/peerpolicy ./internal/httpd/... ./internal/cli ./internal/adapters/chatdriver/...

  renderer:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            packages/product-ui/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm ci --prefix packages/product-ui
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend test -- PeerRoom PeerTimeline PeerExecution PeerSettings PeerMemberPicker PeerTasks Sidebar CreateProjectFlow SessionsBoard shell-new-session-shortcut
