{
  "name": "Checks",
  "on": ["push", "pull_request", "workflow_dispatch"],
  "permissions": {"contents": "read"},
  "concurrency": {
    "group": "${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "backend": {
      "name": "Backend (Python ${{ matrix.python }})",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "strategy": {
        "fail-fast": false,
        "matrix": {"python": ["3.9", "3.13"]}
      },
      "env": {"WT_REQUIRE_LOOPBACK_TESTS": "1"},
      "steps": [
        {
          "name": "Check out source (checkout v7.0.1)",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {"persist-credentials": false}
        },
        {
          "name": "Set up Python (setup-python v7.0.0)",
          "uses": "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97",
          "with": {"python-version": "${{ matrix.python }}"}
        },
        {
          "name": "Run backend tests with fixture Agents only",
          "run": "python3 -m unittest discover -s tests -q"
        }
      ]
    },
    "native-isolation": {
      "name": "Native macOS isolation (offline canaries)",
      "runs-on": "macos-15",
      "timeout-minutes": 10,
      "env": {"WT_REQUIRE_ISOLATION_TESTS": "1"},
      "steps": [
        {
          "name": "Check out source (checkout v7.0.1)",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {"persist-credentials": false}
        },
        {
          "name": "Set up Python (setup-python v7.0.0)",
          "uses": "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97",
          "with": {"python-version": "3.13"}
        },
        {
          "name": "Require real OS denials without calling Agents",
          "run": "python3 -m unittest tests.core.test_isolation -q"
        }
      ]
    },
    "frontend": {
      "name": "Frontend and shipped assets",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "name": "Check out source (checkout v7.0.1)",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {"persist-credentials": false}
        },
        {
          "name": "Set up Node (setup-node v7.1.0)",
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {"node-version": "24", "cache": "npm", "cache-dependency-path": "web/package-lock.json"}
        },
        {
          "name": "Install locked dependencies without lifecycle scripts",
          "working-directory": "web",
          "run": "npm ci --ignore-scripts --no-audit --no-fund"
        },
        {"name": "Run frontend tests", "working-directory": "web", "run": "npm test"},
        {"name": "Build production assets", "working-directory": "web", "run": "npm run build"},
        {"name": "Check shipped assets match the build", "run": "python3 scripts/check_static.py"}
      ]
    }
  }
}
